server:
  port: 8080

spring:
  application:
    name: backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # Scheduled work used to share one thread. The admission sweep runs every 300 ms and, with a big Redis keyspace, can take
  # longer than that; it then always came first and the stream tasks (refresh, heartbeat, rank flush) never got a turn, so
  # dead connections were never noticed. A few threads let them run side by side.
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Connections this service may hold to its database (HikariCP's default is 10). More lets more requests work at the same
      # time but every one is a connection MySQL has to serve, and MySQL's own limit (max_connections, 151 by default) is shared
      # by all services and all replicas - raise them together. Measured under a 2,500-person spike: docs/design-notes.md.
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
    show-sql: ${JPA_SHOW_SQL:false}
  # Schema changes are versioned SQL in db/migration (Flyway), not whatever Hibernate decides at startup.
  # baseline-on-migrate lets a database that predates Flyway (built by the old ddl-auto: update) adopt V1 as
  # already applied instead of failing on a non-empty schema; a brand-new database runs V1 to create everything.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ticketing.backend.messaging

# Verification only here (auth-service is the one that mints tokens) - secret must match
# auth-service's exactly since that's what makes a JWT it signs valid here too.
jwt:
  # Deliberately no default: a secret baked into the source is a secret everyone has, and whoever holds it can
  # forge tokens. The service refuses to start until JWT_SECRET is set (see .env.example).
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

event:
  service:
    uri: ${EVENT_SERVICE_URI:http://event-service:8080}

queue:
  # Sized from a 5000-VU k6 load test (loadtest/reserve_flow.js): with more than ~500 concurrent
  # reservation-fighters, seat-lock contention pushed p95 reservation latency past 3.5s; at 500 it
  # stayed under 800ms with near-zero lock conflicts. Lower this for a local demo of the waiting
  # room UI (e.g. QUEUE_ACTIVE_CAPACITY=3 via .env) - it's still fully overridable per environment.
  active-capacity: ${QUEUE_ACTIVE_CAPACITY:500}
  admission-interval-ms: ${QUEUE_ADMISSION_INTERVAL_MS:300}
  # How long a pass lasts after being let in. Five minutes: someone who is let in and then does nothing keeps a slot for
  # that long, so the shorter the better - but someone who is still choosing seats must not lose it, which is what
  # pass-extension-ms is for. The 5 minutes is a starting value, not a measured one (see AdmissionUseTracker for the
  # numbers that would settle it).
  pass-token-ttl-ms: ${QUEUE_PASS_TOKEN_TTL_MS:300000}
  # When a person holds a seat, their pass is lengthened to at least this much from that moment (about the time a seat is
  # held), so that finishing the purchase or choosing another seat does not send them back to the queue. 0 turns it off.
  pass-extension-ms: ${QUEUE_PASS_EXTENSION_MS:300000}
  # A buyer who has paid gives their slot back right away instead of holding it until the pass token expires.
  release-slot-on-purchase: ${QUEUE_RELEASE_SLOT_ON_PURCHASE:true}

# reCAPTCHA v2 server-side check (see CaptchaVerifier). No secret = captcha off; CAPTCHA_ENABLED=false
# switches it off even when a secret is set (load tests).
captcha:
  enabled: ${CAPTCHA_ENABLED:true}
  secret: ${RECAPTCHA_SECRET_KEY:}
  verify-url: https://www.google.com/recaptcha/api/siteverify

# Metrics for Prometheus, on a separate port that only exists inside the docker network: nothing routes to it (the
# gateway forwards /api/** only), so it is never reachable from outside and needs no authentication of its own.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
