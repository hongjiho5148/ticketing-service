# 메인 설정에서 시크릿 기본값을 없앴으므로 @SpringBootTest 컨텍스트가 뜰 수 있도록 하는 테스트 전용 값이다.
# 앱에 포함되지 않고 다른 곳에서는 유효하지 않다. 실제 시크릿은 .env에서 온다.
jwt.secret=test-only-jwt-secret-never-used-anywhere-else-0123456789abcdefghij
# 어떤 테스트 컨텍스트도 입장 타이머를 스스로 돌리지 않는다. 캐시된 모든 컨텍스트가 compose Redis를 같이 쓰므로, 그중 하나에
# 타이머가 돌고 있으면 다른 테스트의 대기열 사람들을 그 테스트가 확인하기도 전에 입장시켜 버린다. 사람들이 입장해야 하는
# 테스트는 스위퍼를 손으로 호출한다.
queue.admission-interval-ms=3600000
