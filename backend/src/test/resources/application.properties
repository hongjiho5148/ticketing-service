# Test-only values so @SpringBootTest contexts can start now that the main config has no secret defaults.
# Not packaged with the app and never valid anywhere else - real secrets come from .env.
jwt.secret=test-only-jwt-secret-never-used-anywhere-else-0123456789abcdefghij
# No test context runs the admission timer on its own: every cached context shares the compose Redis, so a timer left
# running in one of them would let in the waiters of another test's queue before it can check them. Tests that need
# people let in call the sweeper by hand.
queue.admission-interval-ms=3600000
