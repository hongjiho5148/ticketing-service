server:
  port: 8080
  # nginx와 게이트웨이 뒤에 있다. 이 설정이 없으면 OAuth2의 "{baseUrl}/login/oauth2/code/{registrationId}"
  # 리다이렉트 URI가 공개 주소 localhost:8080이 아니라 내부 컨테이너 호스트 이름으로 풀린다.
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  task:
    execution:
      thread-name-prefix: auth-async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 200
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing_auth}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
    show-sql: ${JPA_SHOW_SQL:false}
  # 스키마 변경은 Hibernate가 시작할 때 알아서 정하는 것이 아니라 db/migration(Flyway)의 버전 있는 SQL로 한다.
  # baseline-on-migrate는 Flyway 이전에 만들어진 DB(예전 ddl-auto: update로 만든 것)가 비어 있지 않은 스키마에서 실패하지 않고
  # V1을 이미 적용된 것으로 받아들이게 한다. 완전히 새로운 DB는 V1을 실행해서 모든 것을 만든다.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # "openid" 스코프는 일부러 넣지 않았다. 일반 OAuth2 로그인으로 유지해서(CustomOAuth2UserService를 거친다)
            # Spring의 별도 OIDC 사용자 서비스 경로를 타지 않게 한다.
            scope: email,profile
            # "{baseUrl}" 템플릿 대신 알려진 공개 오리진으로 고정했다. 이 서비스는 nginx와 게이트웨이 뒤에 있는데,
            # 게이트웨이가 업스트림으로 넘기는 X-Forwarded-*에 포트가 안정적으로 실리지 않아서 이 URL이 깨졌다.
            redirect-uri: "${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}

jwt:
  # 일부러 기본값이 없다. 소스에 박아 둔 시크릿은 모두가 가진 시크릿이고, 그것을 가진 사람은 토큰을 위조할 수 있다.
  # JWT_SECRET이 설정될 때까지 서비스는 시작을 거부한다(.env.example 참고).
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  admin-access-token-expiration-ms: ${JWT_ADMIN_ACCESS_EXPIRATION_MS:900000}

# reCAPTCHA v2 서버 쪽 검사(CaptchaVerifier 참고). 시크릿이 없으면 캡차는 꺼진다. CAPTCHA_ENABLED=false는
# 시크릿이 있어도 캡차를 끈다(부하 테스트용).
captcha:
  enabled: ${CAPTCHA_ENABLED:true}
  secret: ${RECAPTCHA_SECRET_KEY:}
  verify-url: https://www.google.com/recaptcha/api/siteverify

# Prometheus용 메트릭이며 docker 네트워크 안에만 있는 별도 포트로 내보낸다. 그 포트로 가는 라우트가 없어서
# (게이트웨이는 /api/**만 전달한다) 밖에서는 닿지 않으므로 자체 인증이 필요 없다.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
