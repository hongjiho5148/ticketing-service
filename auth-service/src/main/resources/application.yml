server:
  port: 8080
  # Sits behind nginx+gateway - without this, OAuth2's "{baseUrl}/login/oauth2/code/{registrationId}"
  # redirect-uri resolves to the internal container hostname instead of the public localhost:8080.
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  task:
    execution:
      thread-name-prefix: auth-async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 200
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing_auth}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
    show-sql: ${JPA_SHOW_SQL:false}
  # Schema changes are versioned SQL in db/migration (Flyway), not whatever Hibernate decides at startup.
  # baseline-on-migrate lets a database that predates Flyway (built by the old ddl-auto: update) adopt V1 as
  # already applied instead of failing on a non-empty schema; a brand-new database runs V1 to create everything.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # No "openid" scope on purpose: keeps this a plain OAuth2 login (routed through
            # CustomOAuth2UserService) instead of Spring's separate OIDC user-service path.
            scope: email,profile
            # Hardcoded to the known public origin rather than the "{baseUrl}" template: this
            # service sits behind nginx+gateway, and gateway's X-Forwarded-* propagation to the
            # upstream doesn't reliably carry the port through, which corrupted this URL.
            redirect-uri: "${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}

jwt:
  # Deliberately no default: a secret baked into the source is a secret everyone has, and whoever holds it can
  # forge tokens. The service refuses to start until JWT_SECRET is set (see .env.example).
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  admin-access-token-expiration-ms: ${JWT_ADMIN_ACCESS_EXPIRATION_MS:900000}

# reCAPTCHA v2 server-side check (see CaptchaVerifier). No secret = captcha off; CAPTCHA_ENABLED=false
# switches it off even when a secret is set (load tests).
captcha:
  enabled: ${CAPTCHA_ENABLED:true}
  secret: ${RECAPTCHA_SECRET_KEY:}
  verify-url: https://www.google.com/recaptcha/api/siteverify

# Metrics for Prometheus, on a separate port that only exists inside the docker network: nothing routes to it (the
# gateway forwards /api/** only), so it is never reachable from outside and needs no authentication of its own.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
