server:
  port: 8080

spring:
  application:
    name: reservation-service
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing_reservation}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
    show-sql: ${JPA_SHOW_SQL:false}
  # Schema changes are versioned SQL in db/migration (Flyway), not whatever Hibernate decides at startup.
  # baseline-on-migrate lets a database that predates Flyway (built by the old ddl-auto: update) adopt V1 as
  # already applied instead of failing on a non-empty schema; a brand-new database runs V1 to create everything.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  # The default scheduler has a single thread, so a slow sweep (remote calls) would hold up the outbox relay and a
  # relay waiting on a down broker would hold up the sweeps.
  task:
    scheduling:
      pool:
        size: 3
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Verification only here (auth-service is the one that mints tokens) - secret must match
# auth-service's/backend's exactly since that's what makes a JWT it signs valid here too.
jwt:
  # Deliberately no default: a secret baked into the source is a secret everyone has, and whoever holds it can
  # forge tokens. The service refuses to start until JWT_SECRET is set (see .env.example).
  secret: ${JWT_SECRET}

# Events reach Kafka through the outbox table (see OutboxRelay); these are its defaults.
outbox:
  relay-interval-ms: 500
  send-timeout-ms: 5000
  # How long a relay holds the rows it claimed; another instance takes them over if it dies mid-send.
  lease-ms: 30000
  # SQL LIKE pattern of the topics this relay sends ("%" = all).
  topic-pattern: "%"
  retention-hours: 24
  purge-cron: "0 0 * * * *"

reservation:
  hold-expire-sweep-cron: "0 * * * * *"
  # Seats one user may hold or own per event - the usual anti-scalping cap on ticketing sites.
  max-seats-per-event: ${RESERVATION_MAX_SEATS_PER_EVENT:4}

event:
  service:
    uri: ${EVENT_SERVICE_URI:http://event-service:8080}

queue:
  service:
    uri: ${BACKEND_URI:http://backend:8080}
