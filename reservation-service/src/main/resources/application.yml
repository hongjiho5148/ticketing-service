server:
  port: 8080

spring:
  application:
    name: reservation-service
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing_reservation}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 이 서비스가 DB에 열어 둘 수 있는 연결 수다(HikariCP 기본값은 10). 늘리면 더 많은 요청이 동시에 일하지만 하나하나가
      # MySQL이 맡아야 하는 연결이고, MySQL 자체의 한도(max_connections, 기본 151)는 모든 서비스와 모든 복제본이
      # 나눠 쓰므로 함께 올려야 한다. 2,500명 폭주에서 측정한 결과는 docs/design-notes.md 참고.
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
    show-sql: ${JPA_SHOW_SQL:false}
  # 스키마 변경은 Hibernate가 시작할 때 알아서 정하는 것이 아니라 db/migration(Flyway)의 버전 있는 SQL로 한다.
  # baseline-on-migrate는 Flyway 이전에 만들어진 DB(예전 ddl-auto: update로 만든 것)가 비어 있지 않은 스키마에서 실패하지 않고
  # V1을 이미 적용된 것으로 받아들이게 한다. 완전히 새로운 DB는 V1을 실행해서 모든 것을 만든다.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  # 기본 스케줄러는 스레드가 하나라서, 느린 스윕(원격 호출)이 아웃박스 릴레이를 막고 죽은 브로커를 기다리는
  # 릴레이가 스윕을 막을 수 있다.
  task:
    scheduling:
      pool:
        size: 3
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# 여기서는 검증만 한다(토큰을 발급하는 것은 auth-service). 시크릿은 auth-service/backend와 정확히 같아야 한다.
# 그래야 그쪽에서 서명한 JWT가 여기서도 유효하다.
jwt:
  # 일부러 기본값이 없다. 소스에 박아 둔 시크릿은 모두가 가진 시크릿이고, 그것을 가진 사람은 토큰을 위조할 수 있다.
  # JWT_SECRET이 설정될 때까지 서비스는 시작을 거부한다(.env.example 참고).
  secret: ${JWT_SECRET}

# 이벤트는 아웃박스 테이블을 거쳐 Kafka에 닿는다(OutboxRelay 참고). 아래는 그 기본값이다.
outbox:
  relay-interval-ms: 500
  send-timeout-ms: 5000
  # 릴레이가 가져간 행을 얼마나 쥐고 있는지. 전송 도중 죽으면 다른 인스턴스가 넘겨받는다.
  lease-ms: 30000
  # 이 릴레이가 보내는 토픽의 SQL LIKE 패턴("%" = 전체).
  topic-pattern: "%"
  retention-hours: 24
  purge-cron: "0 0 * * * *"

reservation:
  hold-expire-sweep-cron: "0 * * * * *"
  # 한 사용자가 한 공연에서 잡거나 가질 수 있는 좌석 수. 티켓팅 사이트에서 흔히 쓰는 암표 방지 상한이다.
  max-seats-per-event: ${RESERVATION_MAX_SEATS_PER_EVENT:4}

event:
  service:
    uri: ${EVENT_SERVICE_URI:http://event-service:8080}

queue:
  service:
    uri: ${BACKEND_URI:http://backend:8080}

# Prometheus용 메트릭이며 docker 네트워크 안에만 있는 별도 포트로 내보낸다. 그 포트로 가는 라우트가 없어서
# (게이트웨이는 /api/**만 전달한다) 밖에서는 닿지 않으므로 자체 인증이 필요 없다.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
