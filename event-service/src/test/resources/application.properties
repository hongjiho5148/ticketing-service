# Test-only values so @SpringBootTest contexts can start now that the main config has no secret defaults.
# Not packaged with the app and never valid anywhere else - real secrets come from .env.
jwt.secret=test-only-jwt-secret-never-used-anywhere-else-0123456789abcdefghij
# Test contexts share the compose database, so none of them runs the sweepers on its own: a sweep that fires while a test is
# running would act on the real shows (closing the ones whose sales window has passed).
event.sales-close-sweep-cron=-
