server:
  port: 8080

spring:
  application:
    name: event-service
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing_event}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Verification only here (auth-service is the one that mints tokens) - secret must match
# auth-service's/backend's exactly since that's what makes a JWT it signs valid here too.
jwt:
  secret: ${JWT_SECRET:local-development-secret-key-change-me-please-32bytes-min}

redis:
  seat-lock:
    wait-ms: 500
    lease-ms: 3000

seat:
  hold-expiry-sweep-cron: "0 * * * * *"

order:
  service:
    uri: ${ORDER_SERVICE_URI:http://order-service:8080}

auth:
  service:
    uri: ${AUTH_SERVICE_URI:http://auth-service:8080}

alert:
  # "오픈 알림": how often to look for events whose openAt has passed, and how many mails to send per tick.
  open-sweep-cron: "0 * * * * *"
  open-batch-size: 50
  # "취소표 알림": subscribers notified per freed seat, oldest first - a cap so one cancellation
  # doesn't mail the whole waitlist for a single seat.
  waitlist-notify-per-seat: 3

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
