server:
  port: 8080

spring:
  application:
    name: event-service
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing_event}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Verification only here (auth-service is the one that mints tokens) - secret must match
# auth-service's/backend's exactly since that's what makes a JWT it signs valid here too.
jwt:
  secret: ${JWT_SECRET:local-development-secret-key-change-me-please-32bytes-min}

redis:
  seat-lock:
    wait-ms: 500
    lease-ms: 3000

seat:
  hold-expiry-sweep-cron: "0 * * * * *"
