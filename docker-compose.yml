services:
  mysql:
    image: mysql:8.0
    container_name: ticketing-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: ticketing-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    expose:
      - "9092"

  auth-service:
    build: ./auth-service
    container_name: ticketing-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing_auth
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      APP_FRONTEND_URL: http://localhost:5173
      APP_BACKEND_URL: http://localhost:8080
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
    expose:
      - "8080"

  event-service:
    build: ./event-service
    container_name: ticketing-event-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing_event
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "8080"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      event-service:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENT_SERVICE_URI: http://event-service:8080
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
    expose:
      - "8080"

  order-service:
    build: ./order-service
    container_name: ticketing-order-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      event-service:
        condition: service_started
      reservation-service:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing_order
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      EVENT_SERVICE_URI: http://event-service:8080
      RESERVATION_SERVICE_URI: http://reservation-service:8080
    expose:
      - "8080"

  reservation-service:
    build: ./reservation-service
    container_name: ticketing-reservation-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      event-service:
        condition: service_started
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing_reservation
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENT_SERVICE_URI: http://event-service:8080
      # Through nginx's backend load-balancer port (8081), not straight to backend:8080 - see the
      # comment on that nginx server block for why backend specifically needs a resolver in front.
      BACKEND_URI: http://nginx:8081
    expose:
      - "8080"

  gateway:
    build: ./gateway
    container_name: ticketing-gateway
    restart: unless-stopped
    depends_on:
      - backend
      - auth-service
      - event-service
      - reservation-service
      - order-service
    environment:
      # Per-IP throttling is on by default; a load test is one IP, so switch it off for those runs.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    expose:
      - "8080"
    # Pinned so nginx can reach gateway by IP instead of by DNS name - see nginx.conf's
    # gateway_upstream comment for why. gateway is never scaled (container_name above already
    # forces that), so one fixed address is safe and never goes stale across redeploys.
    # .100 is deliberately far from Docker's auto-assigned range (it hands out .2, .3, .4... to
    # every other service in this file) so nothing else can grab this address out from under
    # gateway before it starts.
    networks:
      default:
        ipv4_address: 172.28.0.100

  nginx:
    image: nginx:1.27-alpine
    container_name: ticketing-nginx
    restart: unless-stopped
    depends_on:
      - gateway
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    expose:
      - "8081"

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-data:
  redis-data:
