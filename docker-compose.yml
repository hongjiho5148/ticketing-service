services:
  mysql:
    image: mysql:8.0
    container_name: ticketing-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: ticketing-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    expose:
      - "9092"

  auth-service:
    build: ./auth-service
    container_name: ticketing-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing_auth
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      APP_FRONTEND_URL: http://localhost:5173
      APP_BACKEND_URL: http://localhost:8080
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
    expose:
      - "8080"

  event-service:
    build: ./event-service
    container_name: ticketing-event-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing_event
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "8080"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      event-service:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENT_SERVICE_URI: http://event-service:8080
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
    expose:
      - "8080"

  order-service:
    build: ./order-service
    container_name: ticketing-order-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      event-service:
        condition: service_started
      reservation-service:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing_order
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      EVENT_SERVICE_URI: http://event-service:8080
      RESERVATION_SERVICE_URI: http://reservation-service:8080
    expose:
      - "8080"

  reservation-service:
    build: ./reservation-service
    container_name: ticketing-reservation-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      event-service:
        condition: service_started
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ticketing_reservation
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENT_SERVICE_URI: http://event-service:8080
      # nginx의 backend 로드밸런서 포트(8081)를 거치며 backend:8080으로 바로 가지 않는다. backend에만 앞단 리졸버가
      # 필요한 이유는 그 nginx server 블록의 주석을 참고.
      BACKEND_URI: http://nginx:8081
    expose:
      - "8080"

  gateway:
    build: ./gateway
    container_name: ticketing-gateway
    restart: unless-stopped
    depends_on:
      - backend
      - auth-service
      - event-service
      - reservation-service
      - order-service
    environment:
      # IP별 제한은 기본으로 켜져 있다. 부하 테스트는 IP 하나이므로 그런 실행에서는 끈다.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    expose:
      - "8080"
    # nginx가 DNS 이름이 아니라 IP로 gateway에 닿을 수 있도록 고정한다. 이유는 nginx.conf의
    # gateway_upstream 주석 참고. gateway는 스케일하지 않으므로(위의 container_name이 이미 그렇게 강제한다)
    # 고정 주소 하나면 안전하고, 재배포를 거쳐도 낡을 일이 없다.
    # .100은 일부러 Docker가 자동 배정하는 범위에서 멀리 떨어뜨렸다(이 파일의 다른 모든 서비스에는 .2, .3, .4...를
    # 나눠 준다). 그래서 gateway가 시작하기 전에 다른 것이 이 주소를 가로챌 수 없다.
    networks:
      default:
        ipv4_address: 172.28.0.100

  nginx:
    image: nginx:1.27-alpine
    container_name: ticketing-nginx
    restart: unless-stopped
    depends_on:
      - gateway
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    expose:
      - "8081"

  # 메트릭과 대시보드. 둘 다 localhost에만 바인딩한다. Grafana는 http://localhost:3030(Prometheus는 9091)에서 연다.
  # Grafana는 이 PC의 누구나 대시보드를 볼 수 있게 한다(익명 뷰어). 대시보드를 바꾸려면 관리자 로그인이 필요하다.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ticketing-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ticketing-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pickseat.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3030:3000"

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
