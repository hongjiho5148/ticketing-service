server:
  port: 8080
  # Trust nginx's X-Forwarded-Host/Proto so this gateway resolves its own "current request" as
  # localhost:8080 - it then re-emits fresh X-Forwarded-* headers reflecting that when proxying
  # onward, which is what lets auth-service build a correct OAuth2 redirect-uri in turn.
  forward-headers-strategy: framework

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          # Without this, the gateway won't honor/re-emit X-Forwarded-* from nginx at all - every
          # hop is inside our own docker network here, so trusting all of it is fine.
          trusted-proxies: .*
          routes:
            # Remaining routes still point at the monolith - splitting each domain out is just
            # swapping that route's `uri` for the new service's address (see docs/02_엔티티설계서.docx §3
            # for the target service/table ownership this mirrors). auth-service was the first cut.
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://auth-service:8080}
              predicates:
                - Path=/api/auth/**,/oauth2/**,/login/oauth2/**
            - id: event-service
              uri: ${EVENT_SERVICE_URI:http://event-service:8080}
              predicates:
                - Path=/api/events/**
            # Wishlist is a sibling of /api/events/** (not /api/events/{id}/wishlist), same reason
            # order-service-admin below needs its own route rather than riding another service's.
            - id: event-service-wishlist
              uri: ${EVENT_SERVICE_URI:http://event-service:8080}
              predicates:
                - Path=/api/wishlist/**
            - id: queue-service
              # Through nginx's backend load-balancer port (8081), not straight to backend:8080 -
              # backend is the one service that actually gets scaled, and this gateway's own HTTP
              # client doesn't spread requests across replicas on its own (confirmed by testing:
              # every request landed on the same container). nginx re-resolves `backend` per
              # request instead and picks up whichever replicas are currently up.
              uri: ${BACKEND_URI:http://nginx:8081}
              predicates:
                - Path=/api/queue/**
            - id: reservation-service
              uri: ${RESERVATION_SERVICE_URI:http://reservation-service:8080}
              predicates:
                - Path=/api/reservations/**
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://order-service:8080}
              predicates:
                - Path=/api/orders/**
            # order-service's admin endpoints (ticket scan, and more to come - order summary,
            # coupons) live under /api/admin/**, a sibling of /api/orders/** rather than a
            # subpath of it, so they need their own route. event-service's admin endpoints don't
            # need one of their own since they're nested under /api/events/admin/**, already
            # covered by the event-service route above.
            - id: order-service-admin
              uri: ${ORDER_SERVICE_URI:http://order-service:8080}
              predicates:
                - Path=/api/admin/**

cors:
  # 5173 = public site, 5174 = admin app (separate origin on purpose, so the two never share storage).
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
