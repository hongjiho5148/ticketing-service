server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Every route points at the monolith today - splitting a domain out later is just
            # swapping that route's `uri` for the new service's address (see docs/02_엔티티설계서.docx §3
            # for the target service/table ownership this mirrors).
            - id: auth-service
              uri: ${BACKEND_URI:http://backend:8080}
              predicates:
                - Path=/api/auth/**,/oauth2/**,/login/oauth2/**
            - id: event-service
              uri: ${BACKEND_URI:http://backend:8080}
              predicates:
                - Path=/api/events/**
            - id: queue-service
              uri: ${BACKEND_URI:http://backend:8080}
              predicates:
                - Path=/api/queue/**
            - id: reservation-service
              uri: ${BACKEND_URI:http://backend:8080}
              predicates:
                - Path=/api/reservations/**
            - id: order-service
              uri: ${BACKEND_URI:http://backend:8080}
              predicates:
                - Path=/api/orders/**
