server:
  port: 8080

spring:
  application:
    name: order-service
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing_order}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Verification only here (auth-service is the one that mints tokens) - secret must match
# auth-service's/backend's exactly since that's what makes a JWT it signs valid here too.
jwt:
  secret: ${JWT_SECRET:local-development-secret-key-change-me-please-32bytes-min}

portone:
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  api-secret: ${PORTONE_API_SECRET:}
  api-base-url: https://api.portone.io

ticket:
  issuance-sweep-cron: "0 * * * * *"
  # How far ahead of the show the sweeper starts issuing QR tickets for paid orders.
  issuance-lead-hours: 2
  qr-token:
    # Deliberately a different secret from jwt.secret above - a QR shown at the gate and a login
    # token are never interchangeable even if one leaks.
    secret: ${QR_TOKEN_SECRET:local-development-qr-secret-key-change-me-please-32bytes-min}
    expiration-ms: ${QR_TOKEN_EXPIRATION_MS:21600000}

identity-verification:
  # SELF_ATTESTED is a checkbox stand-in for a real identity check; to use a real provider (PASS,
  # PortOne identity verification) add an IdentityVerificationProvider bean and name its method here.
  provider: SELF_ATTESTED
  required: ${IDENTITY_VERIFICATION_REQUIRED:true}

transfer:
  # Transfers close at the same moment QR issuance opens, so a QR never has to be re-issued for a new holder.
  cutoff-hours: ${ticket.issuance-lead-hours}

reminder:
  sweep-cron: "0 * * * * *"
  # D-1 reminder window: orders whose show starts between 24h and (24h + window) from now.
  lead-hours: 24
  window-hours: 1

event:
  service:
    uri: ${EVENT_SERVICE_URI:http://event-service:8080}

reservation:
  service:
    uri: ${RESERVATION_SERVICE_URI:http://reservation-service:8080}

auth:
  service:
    uri: ${AUTH_SERVICE_URI:http://auth-service:8080}
