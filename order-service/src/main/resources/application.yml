server:
  port: 8080

spring:
  application:
    name: order-service
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing_order}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

# Verification only here (auth-service is the one that mints tokens) - secret must match
# auth-service's/backend's exactly since that's what makes a JWT it signs valid here too.
jwt:
  secret: ${JWT_SECRET:local-development-secret-key-change-me-please-32bytes-min}

portone:
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  api-secret: ${PORTONE_API_SECRET:}
  api-base-url: https://api.portone.io

event:
  service:
    uri: ${EVENT_SERVICE_URI:http://event-service:8080}

reservation:
  service:
    uri: ${RESERVATION_SERVICE_URI:http://reservation-service:8080}
