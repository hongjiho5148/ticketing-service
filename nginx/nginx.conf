worker_processes auto;
worker_rlimit_nofile 65535;

events {
    # 열린 대기열 스트림(SSE) 하나는 여기서 연결 두 개를 쓴다. 하나는 브라우저로, 하나는 backend 복제본으로 가며, 워커 하나가
    # 자기 연결을 전부 쥔다. 8192일 때 스트림 6,000개를 연 테스트가 약 4,370개에서 끊겼다(backend 자체는 5,000개 스트림
    # 상한에 한참 못 미쳤다). 32768이면 backend의 상한이 먼저 걸린다. 연결은 하나당 파일 디스크립터 하나이고,
    # 위의 worker_rlimit_nofile이 이를 덮는다.
    worker_connections 32768;
    multi_accept on;
}

http {
    # gateway는 실제로는 스케일하지 않고(docker-compose가 하나의 고정 container_name으로 못 박아 놓아서
    # `--scale gateway=N>1`은 충돌만 난다) IP도 고정되어 있다(docker-compose.yml의 networks.default). 그래서
    # 이 업스트림은 DNS 조회가 전혀 필요 없다. nginx가 시작할 때도, gateway를 다시 배포한 뒤에도 마찬가지다.
    # 호스트 이름 기반의 정적 업스트림은 두 가지 실패 방식을 가졌을 것이다. `gateway`가 아직 풀리지 않으면
    # nginx가 시작조차 거부하는 것(호스트 재시작이 gateway를 죽인 뒤 실제로 겪었다. nginx가 "host not found
    # in upstream"을 로그에 남기고 gateway를 먼저 켜기 전까지 부팅되지 않았다), 그리고 gateway의 컨테이너가 다시
    # 만들어진 뒤 낡은 IP가 캐시되는 것이다. 여기의 고정 IP + `keepalive` 조합은 둘 다 피하면서 연결도 풀링한다.
    # 그것이 이 업스트림 블록의 핵심인데, nginx는 리졸버가 푸는 변수에서 나온 proxy_pass 대상은 절대 풀링하지
    # 않기 때문이다. (backend도 동적 탐색이 필요하고 다른 방식으로 얻는다. 아래 backend_pool 참고.)
    upstream gateway_upstream {
        server 172.28.0.100:8080;
        keepalive 64;
    }

    # 좌석 목록은 모든 방문자에게 같고 스택에서 가장 무거운 읽기다(좌석 몇천 개, 요청당 JSON 약 350KB를 페이지를 볼 때마다,
    # 그리고 부하 테스트가 반복마다 가져온다). 1초짜리 캐시는 공연당 초당 요청 하나만 event-service에 닿게 하고 나머지는
    # 여기서 응답한다. proxy_cache_lock은 동시에 일어난 캐시 미스가 모두 업스트림으로 가지 않고 그 하나를 기다리게 한다.
    # 대가는 최대 1초 오래된 화면이다. 좌석을 잡는 것은 여전히 서버가 판정하므로(오래된 AVAILABLE은 409를 받을 뿐이다) 해가 없다.
    # 이 경로만 캐시하고, 나머지는 모두 캐시를 거치지 않는다.
    proxy_cache_path /var/cache/nginx/seat_list levels=1:2 keys_zone=seat_list:5m max_size=50m inactive=1m use_temp_path=off;

    map $request_uri $seat_list_bypass {
        default 1;
        ~^/api/events/[0-9]+/seats(\?.*)?$ 0;
    }

    # JSON은 아주 잘 압축된다(반복되는 키: 좌석 목록이 약 360KB에서 28KB로). 레벨 1인 이유는, 여기서는 모든 응답을 nginx가
    # 압축하고 CPU 비용이 레벨에 비례하기 때문이다. 레벨 4는 바이트를 약 7%만 더 줄였다.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_comp_level 1;
    gzip_proxied any;

    # 대기열 업데이트는 오래 유지되는 SSE 연결(GET /api/queue/stream)로 밀어 준다. 기다리는 사람마다 하나이고 기다리는 동안
    # 열려 있다. 게이트웨이를 거치지 않고 backend 복제본으로 바로 간다. 게이트웨이는 열린 스트림마다 요청 스레드
    # 200개 중 하나를 묶어 두는 블로킹 서블릿 프록시이고(측정: 대기자 600명을 통과시키니 약 500명이 끊기거나
    # 거절됐다) 30초 읽기 타임아웃을 넘기는 응답은 끊는다. nginx는 유휴 연결 수천 개를 싸게 쥔다. 게이트웨이가 다른 경로에서
    # 하는 일을 이 경로에서는 여기서 다시 한다. 아래의 CORS 응답(오리진은 게이트웨이의 cors.allowed-origins와 맞춰 둘 것)과 주소별
    # 연결 수 상한이다. 로그인 검사는 같은 JWT를 검증하는 backend에 남는다.
    map $http_origin $queue_stream_cors_origin {
        default "";
        "http://localhost:5173" $http_origin;
    }
    limit_conn_zone $binary_remote_addr zone=queue_stream_per_ip:2m;
    limit_conn_status 429;

    server {
        listen 80;

        location = /api/queue/stream {
            limit_conn queue_stream_per_ip 20;

            # 요청이 Authorization 헤더를 싣고 있어서 브라우저가 먼저 묻는다.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $queue_stream_cors_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary Origin always;
                return 204;
            }
            add_header Access-Control-Allow-Origin $queue_stream_cors_origin always;
            add_header Vary Origin always;

            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            # backend가 15초마다 주석을 보내므로 조용한 스트림은 유휴 상태가 아니다. 이 설정은 죽은 스트림만 제한한다.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://gateway_upstream;
            proxy_cache seat_list;
            proxy_cache_key $request_uri;
            proxy_cache_bypass $seat_list_bypass;
            proxy_no_cache $seat_list_bypass;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_use_stale updating error timeout http_502 http_503;
            # Spring Security는 모든 응답에 no-cache를 표시한다. 이 캐시는 의도한 것이고 좌석 목록에만 적용된다.
            proxy_ignore_headers Cache-Control Expires;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # $host는 포트를 버리므로 $http_host를 쓴다. 그래야 Spring의 forwarded 헤더 지원이 컨테이너 호스트 이름이 아니라
            # 공개된 baseUrl(localhost:8080)을 다시 만들 수 있다. OAuth2의 {baseUrl}/login/oauth2/code/{registrationId}
            # 리다이렉트에 필요하다. X-Forwarded-Port를 명시하는 이유는 nginx 자신의 listen 포트(80)가 공개된 포트(docker-compose에서
            # 매핑한 8080)가 아니라서 여기서는 $server_port로 유도할 수 없기 때문이다.
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8080;
        }
    }

    # `backend`용 내부 전용 로드밸런서이며 docker 네트워크 안에서만 nginx:8081로 닿는다(호스트에는 절대 공개하지 않는다).
    # gateway와 달리 backend는 스케일하는 것이 맞고(`docker compose up --scale backend=N`), 이 스택에서 복제본에 트래픽을
    # 나눠 주는 것은 그것 말고는 없다. gateway 자신의 HTTP 클라이언트는 `backend`를 한 번 풀어서 그 연결/주소를 영원히 재사용한다
    # (확인: 복제본 3개 테스트에서 요청 30개 중 30개가 같은 컨테이너로 갔다). 그래서 이 구간이 스스로 복제본을 찾아야 한다.
    #
    # 이 구간의 내력: 예전에는 `set $var http://backend:8080; proxy_pass $var;`였는데, 요청마다 DNS를 다시 풀어서(부하가 나뉜 것은
    # 그 덕분이다) 연결을 풀링할 수 없고 요청마다 새 TCP 연결을 열었다. VU 1000개 부하 테스트에서 대기열 상태 폴링(초당 약 1000건)이
    # nginx의 임시 포트를 모두 써 버렸다("connect() ... failed (99: Address not available)"가 13,000번, 대기열 입장에서는 502).
    # `server ... resolve`(오픈소스 nginx 1.27.3부터)는 두 성질을 모두 지킨다. 업스트림이 `valid`초마다 다시 풀리므로
    # 오고 가는 복제본을 따라가고, `keepalive`가 현재 그룹에 있는 복제본으로의 연결을 풀링한다. 그다음 nginx가 요청마다 그 사이에서 균형을 맞춘다.
    resolver 127.0.0.11 valid=5s;

    upstream backend_pool {
        zone backend_pool 64k;
        server backend:8080 resolve;
        keepalive 64;
    }

    # $upstream_addr은 요청마다 어느 복제본이 처리했는지 보여 준다. 복제본 사이로 얼마나 나뉘는지를 짐작하지 않고
    # 로그로 확인할 수 있게 하는 값이다.
    log_format backend_lb '$remote_addr "$request" $status -> $upstream_addr ($upstream_response_time s)';

    server {
        listen 8081;
        access_log /dev/stdout backend_lb;

        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
