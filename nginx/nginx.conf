worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    # gateway isn't actually scaled (docker-compose pins it to a single fixed container_name, so
    # `--scale gateway=N>1` would just collide), and its IP is pinned too (networks.default in
    # docker-compose.yml) - so this upstream needs no DNS lookup at all, not at nginx's own
    # startup and not ever again after gateway gets redeployed. A hostname-based static upstream
    # would have had two failure modes instead: nginx refusing to even start if `gateway` weren't
    # resolvable yet (hit this for real after a host restart killed gateway - nginx logged "host
    # not found in upstream" and wouldn't boot until gateway was started first), and a stale
    # cached IP after gateway's container gets recreated. The static-IP + `keepalive` combo here
    # avoids both while still pooling connections - the whole point of this upstream block, since
    # nginx never pools a proxy_pass target that comes from a resolver-driven variable (see the
    # backend_upstream server block below, which accepts exactly that cost on purpose).
    upstream gateway_upstream {
        server 172.28.0.100:8080;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # $http_host (not $host, which drops the port) so Spring's forwarded-header support
            # can rebuild the public-facing baseUrl (localhost:8080) instead of a container
            # hostname - needed for OAuth2's {baseUrl}/login/oauth2/code/{registrationId} redirect.
            # X-Forwarded-Port is explicit because nginx's own listen port (80) isn't the public
            # one (8080, mapped in docker-compose) - it can't be derived from $server_port here.
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8080;
        }
    }

    # Internal-only load balancer for `backend`, reachable at nginx:8081 from inside the docker
    # network only (never exposed to the host). Unlike gateway, backend IS meant to be scaled
    # (`docker compose up --scale backend=N`) - and it turns out nothing else in this stack
    # actually spreads traffic across its replicas: gateway's own HTTP client resolves `backend`
    # once and keeps reusing that one connection/address forever (confirmed - 30/30 requests in a
    # 3-replica test all landed on the same container). Docker's embedded DNS rotates which
    # replica's IP comes back first on each lookup, so re-resolving per request is what actually
    # spreads load - the same dynamic-resolver trick gateway_upstream used to use and moved away
    # from above, for the reasons in that comment. It's the right trade-off here specifically:
    # backend's queue traffic is much lighter than the path that exhausted nginx's ephemeral ports
    # under load, so losing connection pooling on this one hop is cheap. If queue traffic ever
    # grows enough to hit the same wall, this is the first place to look.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 8081;

        location / {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
