worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    # Docker's embedded DNS (127.0.0.11) returns one A record per backend replica and rotates
    # the order on each lookup - resolving "backend" through a variable (instead of a static
    # proxy_pass target) makes nginx re-resolve every 5s and pick up replicas added/removed by
    # `docker compose up --scale backend=N`, spreading requests across whichever are currently up.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location / {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
