worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    # gateway isn't actually scaled (docker-compose pins it to a single fixed container_name, so
    # `--scale gateway=N>1` would just collide) - what IS scaled is backend, behind gateway's own
    # routing, a hop downstream of here. So this upstream can be a static single server instead of
    # a variable-based proxy_pass through nginx's resolver: that dynamic-resolve trick was the
    # previous design (kept re-resolving DNS every 5s to "support" scaling that never happened
    # here), but nginx never pools keepalive connections to a proxy_pass target that comes from a
    # variable - every request opened a brand-new TCP connection to gateway, and enough concurrent
    # short-lived connections exhausted nginx's ephemeral source ports under load (confirmed via
    # k6 1000+ VU runs - many thousands of "Address not available" errors in nginx's error log).
    # A static upstream with `keepalive` fixes that by reusing a small pool of persistent
    # connections instead. Trade-off: nginx caches gateway's IP at startup/reload, so recreating
    # the gateway container (which gets a new IP) requires restarting nginx too, e.g.
    # `docker compose up -d gateway && docker compose restart nginx`.
    upstream gateway_upstream {
        server gateway:8080;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # $http_host (not $host, which drops the port) so Spring's forwarded-header support
            # can rebuild the public-facing baseUrl (localhost:8080) instead of a container
            # hostname - needed for OAuth2's {baseUrl}/login/oauth2/code/{registrationId} redirect.
            # X-Forwarded-Port is explicit because nginx's own listen port (80) isn't the public
            # one (8080, mapped in docker-compose) - it can't be derived from $server_port here.
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8080;
        }
    }
}
