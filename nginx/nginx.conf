worker_processes auto;
worker_rlimit_nofile 65535;

events {
    # Each open queue stream (SSE) takes two connections here, one to the browser and one to a backend replica, and a worker
    # holds all of its own. At 8192 a test that opened 6,000 streams was cut off after about 4,370 (the backend itself was
    # still far from its 5,000-stream limit); 32768 lets the backend's limit come first. Every connection is one file
    # descriptor, which worker_rlimit_nofile above covers.
    worker_connections 32768;
    multi_accept on;
}

http {
    # gateway isn't actually scaled (docker-compose pins it to a single fixed container_name, so
    # `--scale gateway=N>1` would just collide), and its IP is pinned too (networks.default in
    # docker-compose.yml) - so this upstream needs no DNS lookup at all, not at nginx's own
    # startup and not ever again after gateway gets redeployed. A hostname-based static upstream
    # would have had two failure modes instead: nginx refusing to even start if `gateway` weren't
    # resolvable yet (hit this for real after a host restart killed gateway - nginx logged "host
    # not found in upstream" and wouldn't boot until gateway was started first), and a stale
    # cached IP after gateway's container gets recreated. The static-IP + `keepalive` combo here
    # avoids both while still pooling connections - the whole point of this upstream block, since
    # nginx never pools a proxy_pass target that comes from a resolver-driven variable. (backend
    # needs dynamic discovery too, and gets it differently - see backend_pool below.)
    upstream gateway_upstream {
        server 172.28.0.100:8080;
        keepalive 64;
    }

    # The seat list is the same for every visitor and the heaviest read in the stack (a few thousand seats, ~350 KB of JSON
    # per request, fetched on every page view and by the load test on every iteration). A one-second cache lets
    # one request per second per event reach event-service while everyone else is served from here; proxy_cache_lock
    # makes concurrent misses wait for that one instead of all going upstream. The price is a view that can be up to a
    # second old - harmless, because holding a seat is still decided by the server (a stale AVAILABLE just gets a 409).
    # Only this path is cached; everything else bypasses the cache.
    proxy_cache_path /var/cache/nginx/seat_list levels=1:2 keys_zone=seat_list:5m max_size=50m inactive=1m use_temp_path=off;

    map $request_uri $seat_list_bypass {
        default 1;
        ~^/api/events/[0-9]+/seats(\?.*)?$ 0;
    }

    # JSON compresses very well (repeated keys: ~360 KB -> ~28 KB for the seat list). Level 1 because the compressing is
    # done by nginx for every response here and costs CPU in proportion to the level; level 4 saved only ~7% more bytes.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_comp_level 1;
    gzip_proxied any;

    # Queue updates are pushed over long-lived SSE connections (GET /api/queue/stream), one per waiting person, open for
    # as long as they wait. They go straight to the backend replicas and not through the gateway: the gateway is a
    # blocking servlet proxy that ties up one of its 200 request threads for every open stream (measured: 600 waiters
    # through it left ~500 of them cut off or refused) and cuts any response that outlasts its 30s read timeout. nginx
    # holds thousands of idle connections cheaply. What the gateway does for other paths is redone here for this one:
    # the CORS answer below (keep the origins in line with the gateway's cors.allowed-origins) and a cap on connections
    # per address. The login check stays with the backend, which verifies the same JWT.
    map $http_origin $queue_stream_cors_origin {
        default "";
        "http://localhost:5173" $http_origin;
    }
    limit_conn_zone $binary_remote_addr zone=queue_stream_per_ip:2m;
    limit_conn_status 429;

    server {
        listen 80;

        location = /api/queue/stream {
            limit_conn queue_stream_per_ip 20;

            # The browser asks first because the request carries an Authorization header.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $queue_stream_cors_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary Origin always;
                return 204;
            }
            add_header Access-Control-Allow-Origin $queue_stream_cors_origin always;
            add_header Vary Origin always;

            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            # The backend sends a comment every 15s, so a quiet stream is not idle; this only bounds a dead one.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://gateway_upstream;
            proxy_cache seat_list;
            proxy_cache_key $request_uri;
            proxy_cache_bypass $seat_list_bypass;
            proxy_no_cache $seat_list_bypass;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_use_stale updating error timeout http_502 http_503;
            # Spring Security marks every response no-cache; this cache is deliberate and only ever applies to the seat list.
            proxy_ignore_headers Cache-Control Expires;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # $http_host (not $host, which drops the port) so Spring's forwarded-header support
            # can rebuild the public-facing baseUrl (localhost:8080) instead of a container
            # hostname - needed for OAuth2's {baseUrl}/login/oauth2/code/{registrationId} redirect.
            # X-Forwarded-Port is explicit because nginx's own listen port (80) isn't the public
            # one (8080, mapped in docker-compose) - it can't be derived from $server_port here.
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8080;
        }
    }

    # Internal-only load balancer for `backend`, reachable at nginx:8081 from inside the docker
    # network only (never exposed to the host). Unlike gateway, backend IS meant to be scaled
    # (`docker compose up --scale backend=N`) - and nothing else in this stack actually spreads
    # traffic across its replicas: gateway's own HTTP client resolves `backend` once and keeps
    # reusing that one connection/address forever (confirmed - 30/30 requests in a 3-replica test
    # all landed on the same container). So this hop has to discover replicas itself.
    #
    # History of this hop: it used to be `set $var http://backend:8080; proxy_pass $var;`, which
    # re-resolves DNS per request (that is what spread the load) but can never pool connections -
    # every request opened a new TCP connection. Under a 1000-VU load test, queue-status polling
    # (~1000 req/s) used up nginx's ephemeral ports ("connect() ... failed (99: Address not
    # available)", 13k times, and 502s on queue entry). `server ... resolve` (open-source nginx
    # since 1.27.3) keeps both properties: the upstream is re-resolved every `valid` seconds, so
    # replicas that come and go are picked up, and `keepalive` pools connections to whichever
    # replicas are currently in the group. nginx then balances per request across them.
    resolver 127.0.0.11 valid=5s;

    upstream backend_pool {
        zone backend_pool 64k;
        server backend:8080 resolve;
        keepalive 64;
    }

    # $upstream_addr shows which replica served each request, which is how the spread across
    # replicas can be checked from the logs instead of guessed at.
    log_format backend_lb '$remote_addr "$request" $status -> $upstream_addr ($upstream_response_time s)';

    server {
        listen 8081;
        access_log /dev/stdout backend_lb;

        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
