# 알림 규칙이다. 이 구성에는 Alertmanager가 없으므로 Prometheus의 Alerts 페이지(그리고 Grafana의 발생 중인 알림)에 보인다.
# 슬랙이나 메일 같은 채널에 연결하려면 Alertmanager를 추가해야 한다.
groups:
  - name: pickseat
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} ({{ $labels.instance }}) is not answering Prometheus"

      # 계속 고장 난 서킷은 몇 초마다 열림과 반열림 사이를 오간다. 그래서 오래 끊기지 않고 열려 있어야 조건이 되는 것이 아니라
      # 열리는 순간 울리고 그 뒤 30초 동안 계속 울린다.
      - alert: CircuitOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 0s
        keep_firing_for: 30s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} stopped calling {{ $labels.name }}: its circuit is open"

      - alert: OutboxBacklog
        expr: outbox_oldest_unsent_age_seconds > 30
        for: 20s
        labels: { severity: warning }
        annotations:
          summary: "Kafka events have been waiting {{ $value }}s in the outbox - Kafka or the relay is not delivering"

      - alert: ServerErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
            / sum by (application) (rate(http_server_requests_seconds_count[1m])) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: more than 5% of requests are failing with 5xx"

      - alert: DbConnectionsWaiting
        expr: hikaricp_connections_pending > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: requests are waiting for a database connection (pool exhausted)"
