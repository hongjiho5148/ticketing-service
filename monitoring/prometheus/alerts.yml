# 알림 규칙이다. 울리면 Alertmanager를 거쳐 Slack으로 나가고(monitoring/alertmanager), Prometheus의 Alerts 화면에도 보인다.
groups:
  - name: pickseat
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} ({{ $labels.instance }})가 Prometheus에 응답하지 않습니다"

      # MySQL과 Redis는 서비스가 아니라 저장소라서 exporter가 따로 상태를 알려 준다. exporter는 살아 있어도
      # 저장소에 접속하지 못하면 mysql_up, redis_up이 0이 된다. 서비스의 up 지표로는 이 장애를 볼 수 없다.
      - alert: MySqlDown
        expr: mysql_up == 0
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "MySQL에 접속할 수 없습니다. 예약, 주문, 인증이 모두 영향을 받습니다"

      - alert: RedisDown
        expr: redis_up == 0
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "Redis에 접속할 수 없습니다. 대기열과 좌석 잠금이 영향을 받습니다"

      # 계속 고장 난 서킷은 몇 초마다 열림과 반열림 사이를 오간다. 그래서 오래 끊기지 않고 열려 있어야 조건이 되는 것이 아니라
      # 열리는 순간 울리고 그 뒤 30초 동안 계속 울린다.
      - alert: CircuitOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 0s
        keep_firing_for: 30s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}가 {{ $labels.name }} 호출을 멈췄습니다(서킷이 열림)"

      - alert: OutboxBacklog
        expr: outbox_oldest_unsent_age_seconds > 30
        for: 20s
        labels: { severity: warning }
        annotations:
          summary: "Kafka 이벤트가 아웃박스에서 {{ $value | printf \"%.0f\" }}초째 대기 중입니다(Kafka 또는 릴레이가 전달하지 못함)"

      - alert: ServerErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
            / sum by (application) (rate(http_server_requests_seconds_count[1m])) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: 요청의 5% 넘게 5xx로 실패하고 있습니다"

      - alert: DbConnectionsWaiting
        expr: hikaricp_connections_pending > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: 요청이 DB 연결을 기다리고 있습니다(연결 풀 고갈)"
