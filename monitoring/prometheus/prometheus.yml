# Scrapes the metrics port (9090) of every service over the docker network. Nothing here is published to the outside.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:9090"]
        labels: { service: gateway }
      - targets: ["auth-service:9090"]
        labels: { service: auth-service }
      - targets: ["event-service:9090"]
        labels: { service: event-service }
      - targets: ["reservation-service:9090"]
        labels: { service: reservation-service }
      - targets: ["order-service:9090"]
        labels: { service: order-service }

  # backend is scaled to several replicas: ask Docker's DNS for all of them (the name resolves to every replica's IP)
  - job_name: backend
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 9090
        refresh_interval: 10s
    relabel_configs:
      - target_label: service
        replacement: backend
