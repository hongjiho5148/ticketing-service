# docker 네트워크로 모든 서비스의 메트릭 포트(9090)를 수집한다. 여기 있는 어느 것도 바깥에 공개하지 않는다.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

# 규칙이 울리면 Alertmanager로 보내고, 거기서 Slack으로 나간다.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:9090"]
        labels: { service: gateway }
      - targets: ["auth-service:9090"]
        labels: { service: auth-service }
      - targets: ["event-service:9090"]
        labels: { service: event-service }
      - targets: ["reservation-service:9090"]
        labels: { service: reservation-service }
      - targets: ["order-service:9090"]
        labels: { service: order-service }

  # MySQL과 Redis의 상태. 서비스가 아니라 저장소라서 따로 묶는다.
  - job_name: datastores
    static_configs:
      - targets: ["mysql-exporter:9104"]
        labels: { service: mysql }
      - targets: ["redis-exporter:9121"]
        labels: { service: redis }

  # backend는 여러 복제본으로 늘린다. Docker DNS에 모든 복제본을 물어본다(이름이 모든 복제본의 IP로 풀린다)
  - job_name: backend
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 9090
        refresh_interval: 10s
    relabel_configs:
      - target_label: service
        replacement: backend
